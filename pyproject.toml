[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "knowledge-base-cli"
version = "0.1.0"
description = "A local command-line knowledge management system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Kushal Yadav" }
]
dependencies = []


[project.scripts]
kb = "kb.cli:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.pytest.ini_options]
testpaths = ["tests"]